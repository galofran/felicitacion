<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Una sorpresa para ti!</title>
    <!-- Vinculamos el archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <h1 id="titulo">¡Tienes una sorpresa! 🎁</h1>
        <p id="mensaje">Haz clic en el botón para descubrir la gran noticia...</p>

        <!-- La foto empieza oculta mediante la clase CSS 'oculto' -->
        <img id="imagen-bebe" 
             src="https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=600&q=80" 
             alt="Bebé durmiendo" 
             class="baby-img oculto">

        <button id="btn-sorpresa">Descubrir sorpresa</button>
    </div>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="index.js"></script>
</body>
</html>
